<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a24">
<meta name="robots" content="noindex">
<title>ЛКМ CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6b4f'/%3E%3Cpath d='M7 17l9-8 9 8v8H7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f2; --panel:#fff; --ink:#1c2420; --muted:#6b746f; --line:#e2e5df; --accent:#2f6b4f; --accent-ink:#fff;
  --col:#eceee9; --danger:#c43c2c; --warn:#b7791f; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --r:10px; --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141816; --panel:#1d2320; --ink:#e7ebe8; --muted:#97a19b; --line:#2c3430; --accent:#4c9a73; --col:#191e1b; --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* top bar */
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;gap:8px;align-items:center;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.logo{font-weight:700;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:6px 5px 5px;background:#fff;clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.search{flex:1;min-width:0}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5}
select.btn{padding-right:8px}
.sync{width:8px;height:8px;border-radius:50%;background:#7bbf95;flex:none}
.sync.busy{background:#e0b14a}.sync.err{background:var(--danger)}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.toolbar label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.stat{color:var(--muted);margin-left:auto}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding:0 16px 24px;height:calc(100vh - 112px);align-items:flex-start}
.col{flex:0 0 272px;background:var(--col);border-radius:var(--r);display:flex;flex-direction:column;max-height:100%}
.col h3{margin:0;padding:10px 12px 8px;font-size:13px;display:flex;gap:8px;align-items:center;position:sticky;top:0}
.col h3 .dot{width:8px;height:8px;border-radius:50%}
.col h3 .n{color:var(--muted);font-weight:500}
.col h3 .sum{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
.col .list{overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:40px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.card{background:var(--panel);border-radius:8px;padding:9px 10px;box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;user-select:none}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card .m{color:var(--muted);font-size:12px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.card .due{font-size:12px;margin-top:4px}
.due.over{color:var(--danger);font-weight:600}.due.today{color:var(--warn);font-weight:600}
.more{color:var(--muted);text-align:center;padding:6px;font-size:12px;cursor:pointer}

/* mobile: stage tabs + list */
.tabs{display:none}
@media (max-width:760px){
  header{flex-wrap:wrap;padding:8px 12px}
  .search{order:5;flex-basis:100%}
  .logo span{display:none}
  .toolbar{padding:8px 12px}
  .stat{display:none}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:13px}
  .tab b{font-weight:600;margin-left:4px;color:var(--muted)}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tab.on b{color:inherit}
  .board{display:block;height:auto;padding:0 12px 90px}
  .col{display:none;background:transparent}
  .col.on{display:flex}
  .col h3{display:none}
  .col .list{padding:0;overflow:visible}
  .card{padding:12px}
  #fab{display:block}
  #newBtn{display:none}
}
.fab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
  border:0;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:15}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--panel);width:min(720px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.15)}
.sh-head{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sh-head input{flex:1;min-width:0;font-size:18px;font-weight:700;border:0;background:transparent;padding:4px 0}
.sh-head input:focus{outline:none;border-bottom:2px solid var(--accent)}
.stages{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.st{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px}
.st.on{color:#fff;font-weight:600}
.sh-body{flex:1;overflow-y:auto;padding:4px 16px 16px}
.grp{margin-top:14px}
.grp h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:1/-1}
.f span{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.f textarea{min-height:90px;resize:vertical}
.f textarea.brief{min-height:180px}
.f .row{display:flex;gap:6px}.f .row input{flex:1}
.f a.go{display:flex;align-items:center;padding:0 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--accent)}
.chk{flex-direction:row;align-items:center;gap:8px;padding-top:20px}
.chk input{width:18px;height:18px}
.chg{background:color-mix(in srgb,var(--accent) 12%,var(--bg))!important}
.sh-foot{border-top:1px solid var(--line);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.sh-foot .info{color:var(--muted);font-size:12px;margin-right:auto}
.feed{display:flex;flex-direction:column;gap:8px}
.ev{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.ev.note{border-color:var(--accent)}
.ev .h{font-size:12px;color:var(--muted)}
.ev .b{white-space:pre-wrap;overflow-wrap:anywhere}
.addnote{display:flex;gap:8px;margin-bottom:10px}
.addnote textarea{flex:1;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);resize:vertical}

/* login */
.login{max-width:360px;margin:12vh auto;padding:24px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.login h1{font-size:20px;margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 16px}
.login .f{margin-bottom:12px}
.login .btn{width:100%;padding:11px}
.err{color:var(--danger);min-height:20px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:99;max-width:90vw}
</style>
</head>
<body>

<div id="loginView" class="hidden">
  <form class="login" id="loginForm">
    <h1>ЛКМ CRM</h1>
    <p>Клиенты и сделки ЛенКаркасМодуль</p>
    <label class="f"><span>Кто вы</span><select id="lUser" required></select></label>
    <label class="f"><span>PIN</span><input id="lPin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
    <button class="btn primary">Войти</button>
    <div class="err" id="lErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="logo"><i></i><span>ЛКМ CRM</span></div>
    <div class="search"><input id="q" type="search" placeholder="Поиск: имя, телефон, модель, адрес…"></div>
    <span class="sync" id="sync" title="Синхронизация"></span>
    <button class="btn primary" id="newBtn">+ Клиент</button>
    <button class="btn ghost" id="meBtn" title="Выйти"></button>
  </header>
  <div class="toolbar">
    <select class="btn" id="fResp"><option value="">Все ответственные</option></select>
    <label><input type="checkbox" id="fClosed"> закрытые</label>
    <label title="Следующий шаг сегодня или просрочен"><input type="checkbox" id="fDue"> на сегодня</label>
    <span class="stat" id="stat"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="board" id="board"></div>
  <button class="fab" id="fab" aria-label="Новый клиент">+</button>
</div>

<div id="ov" class="ov hidden"></div>

<script>
/* =========================  НАСТРОЙКА  ========================= */
// Адрес API на сервере ЛКМ. Можно переопределить: ?api=https://...
const API = new URLSearchParams(location.search).get('api') || 'https://lenkarkasmodul.shop/crm/api.php';
const DEMO = new URLSearchParams(location.search).has('demo');
/* =============================================================== */

const OPT = {
  source: ['Авито','Сайт — форма','Входящий звонок','Яндекс Карты','2ГИС','Яндекс Директ','Telegram','VK','Сарафан, рекомендация','Партнёр','Другое'],
  model: ['6×2,5 — бытовка 15 м²','3×6 — 18 м²','7×3 — 21 м²','8×3 — 24 м²','6×5 — 30 м²','6×8 — 48 м²','70 м²','76,8 м²','8×10 — 80 м²','Нестандарт'],
  package: ['Тёплый контур','С отделкой','Под ключ','Под ключ + сантехника','Премиум'],
  plot: ['Есть','В процессе покупки','Нет'],
  payment: ['Полная оплата','50/40/10','Рассрочка','Ипотека','Материнский капитал','Безнал, юрлицо','Лизинг'],
  term: ['Сейчас','1-3 месяца','3-6 месяцев','Более 6 месяцев','Не определился'],
  decider: ['Сам','С супругой или супругом','Семья, родители','Юрлицо'],
  lose_reason: ['Цена','Сроки','Нет ипотеки или маткапитала','Ушёл к конкуренту','Передумал строить','Пропал, не отвечает','Не целевой'],
};
const LABEL = {title:'Имя / название',phone:'Телефон',email:'Почта',source:'Источник',responsible:'Ответственный',model:'Модель и размер',
  package:'Комплектация',plot:'Участок',plot_address:'Адрес участка',budget:'Бюджет клиента, ₽',amount:'Сумма КП, ₽',payment:'Способ оплаты',
  term:'Срок',decider:'Кто решает',visit_date:'Дата визита в цех',was_in_shop:'Был в цеху',next_step:'Следующий шаг',next_date:'Дата следующего шага',
  lose_reason:'Причина отказа',avito_chat:'Чат Авито',avito_ad:'Объявление Авито',brief:'Бриф',comment:'Комментарий'};
const GROUPS = [
  ['Клиент', [['phone','tel'],['email','email'],['source','sel'],['responsible','user']]],
  ['Следующий шаг', [['next_step','text','wide'],['next_date','date'],['visit_date','date'],['was_in_shop','chk']]],
  ['Дом', [['model','sel'],['package','sel'],['amount','money'],['budget','money']]],
  ['Участок и решение', [['plot','sel'],['plot_address','text'],['payment','sel'],['term','sel'],['decider','sel'],['lose_reason','sel']]],
  ['Авито', [['avito_ad','text'],['avito_chat','url']]],
  ['Бриф', [['brief','brief','wide'],['comment','area','wide']]],
];

let S = {token:null, me:null, stages:[], users:[], deals:new Map(), since:null, mobileStage:null, open:null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}} };
const money = n => n ? Math.round(n).toLocaleString('ru-RU') + ' ₽' : '';
const today = () => new Date().toLocaleDateString('sv-SE');
const fmtDate = d => d ? new Date(d.length===10 ? d+'T00:00' : d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) : '';
const fmtDT = d => new Date(d).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
function sync(st){$('#sync').className='sync '+(st||'')}

/* ---------- API ---------- */
async function api(action, body={}){
  if (DEMO) return demoApi(action, body);
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, token:S.token, ...body})});
  let j; try { j = await r.json(); } catch { throw new Error('Сервер не ответил ('+r.status+')'); }
  if (r.status === 401 && action !== 'login') { logout(); throw new Error(j.error); }
  if (!j.ok) throw new Error(j.error || 'Ошибка');
  return j;
}

/* ---------- вход ---------- */
async function showLogin(){
  $('#app').classList.add('hidden'); $('#loginView').classList.remove('hidden');
  try { const j = await api('users'); $('#lUser').innerHTML = j.users.map(u=>`<option>${esc(u)}</option>`).join(''); const last=store.get('lkm_last_user'); if(last) $('#lUser').value=last; }
  catch(e){ $('#lErr').textContent = 'Нет связи с сервером: ' + e.message; }
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); $('#lErr').textContent='';
  try { const j = await api('login', {user:$('#lUser').value, pin:$('#lPin').value});
    S.token=j.token; store.set('lkm_token', j.token); store.set('lkm_last_user', j.user); $('#lPin').value=''; start(); }
  catch(err){ $('#lErr').textContent = err.message; }
};
function logout(){ store.set('lkm_token', null); S.token=null; showLogin(); }
$('#meBtn').onclick = () => { if (confirm('Выйти из CRM?')) logout(); };

/* ---------- старт и синхронизация ---------- */
async function start(){
  try {
    const m = await api('meta'); S.me=m.me; S.stages=m.stages; S.users=m.users;
    $('#meBtn').textContent = S.me + ' ⎋';
    $('#fResp').innerHTML = '<option value="">Все ответственные</option>' + S.users.map(u=>`<option ${u===store.get('lkm_resp')?'selected':''}>${esc(u)}</option>`).join('');
    $('#loginView').classList.add('hidden'); $('#app').classList.remove('hidden');
    S.mobileStage = store.get('lkm_tab') || 'UC_X040U9';
    await refresh(true);
  } catch(e){ if (S.token) { await showLogin(); $('#lErr').textContent = e.message; } }
}
async function refresh(full){
  sync('busy');
  try {
    const j = await api('list', full||!S.since ? {light:false} : {since:S.since});
    if (full) S.deals = new Map();
    j.deals.forEach(d => S.deals.set(d.id, d));
    S.since = j.now; sync(''); render();
  } catch(e){ sync('err'); }
}
setInterval(() => { if (S.token && !document.hidden) refresh(false); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token) refresh(false); });

/* ---------- доска ---------- */
const stageById = id => S.stages.find(s=>s.id===id) || {name:id,color:'#999'};
function filtered(){
  const q = $('#q').value.trim().toLowerCase(), qd = q.replace(/\D/g,'');
  const resp = $('#fResp').value, due = $('#fDue').checked, t = today();
  return [...S.deals.values()].filter(d => {
    if (resp && d.responsible !== resp) return false;
    if (due && !(d.next_date && d.next_date <= t)) return false;
    if (q) { const hay = [d.title,d.model,d.plot_address,d.avito_ad,d.comment,d.brief,d.next_step,d.source].join(' ').toLowerCase();
      const ph = String(d.phone||'').replace(/\D/g,'');
      if (!hay.includes(q) && !(qd.length>=4 && ph.includes(qd))) return false; }
    return true;
  });
}
function cardHTML(d){
  const t = today(); let due='';
  if (d.next_date){ const cls = d.next_date < t ? 'over' : d.next_date===t ? 'today' : ''; due = `<div class="due ${cls}">→ ${fmtDate(d.next_date)}${d.next_step?' · '+esc(d.next_step):''}</div>`; }
  else if (d.next_step) due = `<div class="due">→ ${esc(d.next_step)}</div>`;
  const meta = [d.model, money(d.amount), d.responsible].filter(Boolean).map(esc).join(' · ');
  return `<div class="card" draggable="true" data-id="${d.id}"><div class="t">${esc(d.title)}</div>${meta?`<div class="m">${meta}</div>`:''}${due}</div>`;
}
const LIMIT = 60; let expanded = new Set();
function render(){
  const list = filtered(), showClosed = $('#fClosed').checked;
  const stages = S.stages.filter(s => showClosed || !s.closed || s.id===S.mobileStage);
  const by = {}; stages.forEach(s=>by[s.id]=[]);
  list.forEach(d => by[d.stage] && by[d.stage].push(d));
  const sortKey = d => (d.next_date || '9999') + (d.updated_at ? (9e12 - Date.parse(d.updated_at)).toString().padStart(14,'0') : '');
  Object.values(by).forEach(a => a.sort((x,y)=> sortKey(x) < sortKey(y) ? -1 : 1));
  if (!by[S.mobileStage]) S.mobileStage = stages[0]?.id;
  $('#tabs').innerHTML = stages.map(s=>`<button class="tab ${s.id===S.mobileStage?'on':''}" data-tab="${s.id}">${esc(s.name)}<b>${by[s.id].length}</b></button>`).join('');
  $('#board').innerHTML = stages.map(s => {
    const a = by[s.id], sum = a.reduce((x,d)=>x+(+d.amount||0),0), lim = expanded.has(s.id) ? a.length : LIMIT;
    return `<section class="col ${s.id===S.mobileStage?'on':''}" data-stage="${s.id}">
      <h3><span class="dot" style="background:${s.color}"></span>${esc(s.name)} <span class="n">${a.length}</span><span class="sum">${sum?money(sum):''}</span></h3>
      <div class="list">${a.slice(0,lim).map(cardHTML).join('')}${a.length>lim?`<div class="more" data-more="${s.id}">ещё ${a.length-lim}</div>`:''}</div></section>`;
  }).join('');
  $('#stat').textContent = `${list.length} клиентов`;
  const tab = $('#tabs .tab.on'); if (tab) tab.scrollIntoView({block:'nearest',inline:'center'});
}
['#q','#fResp','#fClosed','#fDue'].forEach(s => $(s).addEventListener('input', () => { if(s==='#fResp') store.set('lkm_resp',$('#fResp').value||null); render(); }));
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; S.mobileStage=b.dataset.tab; store.set('lkm_tab',S.mobileStage); render(); window.scrollTo(0,0); };
$('#board').onclick = e => {
  const m = e.target.closest('[data-more]'); if (m){ expanded.add(m.dataset.more); render(); return; }
  const c = e.target.closest('.card'); if (c) openDeal(+c.dataset.id);
};
// drag & drop между колонками (компьютер)
let dragId=null;
$('#board').addEventListener('dragstart', e => { const c=e.target.closest('.card'); if(c){dragId=+c.dataset.id; e.dataTransfer.effectAllowed='move';} });
$('#board').addEventListener('dragover', e => { const col=e.target.closest('.col'); if(col&&dragId){e.preventDefault(); document.querySelectorAll('.col.drop').forEach(x=>x!==col&&x.classList.remove('drop')); col.classList.add('drop');} });
$('#board').addEventListener('dragleave', e => { const col=e.target.closest('.col'); if(col&&!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
$('#board').addEventListener('drop', async e => {
  const col=e.target.closest('.col'); document.querySelectorAll('.col.drop').forEach(x=>x.classList.remove('drop'));
  if(!col||!dragId) return; e.preventDefault(); const id=dragId; dragId=null; await moveDeal(id, col.dataset.stage);
});
async function moveDeal(id, stage){
  const d = S.deals.get(id); if (!d || d.stage===stage) return;
  const prev = d.stage; d.stage = stage; render();
  try { const j = await api('move',{id,stage}); S.deals.set(id,j.deal); render(); toast(`«${d.title}» → ${stageById(stage).name}`); }
  catch(e){ d.stage=prev; render(); toast('Не сохранилось: '+e.message); }
}

/* ---------- карточка ---------- */
$('#newBtn').onclick = $('#fab').onclick = () => openDeal(null);
function fieldHTML(d,[k,type,wide]){
  const v = d[k] ?? '', lab = LABEL[k];
  let inp;
  if (type==='sel'||type==='user'){ const opts = type==='user'? S.users : OPT[k]; const all = v && !opts.includes(v) ? [v,...opts] : opts;
    inp = `<select data-k="${k}"><option value=""></option>${all.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
  else if (type==='chk') return `<label class="f chk"><input type="checkbox" data-k="${k}" ${v?'checked':''}><span>${lab}</span></label>`;
  else if (type==='area'||type==='brief') inp = `<textarea data-k="${k}" class="${type==='brief'?'brief':''}" placeholder="${type==='brief'?'Что хочет клиент, состав семьи, участок, бюджет, сроки, возражения, о чём договорились…':''}">${esc(v)}</textarea>`;
  else if (type==='url') inp = `<div class="row"><input type="url" data-k="${k}" value="${esc(v)}">${v?`<a class="go" href="${esc(v)}" target="_blank" rel="noopener">↗</a>`:''}</div>`;
  else if (type==='tel') inp = `<div class="row"><input type="tel" data-k="${k}" value="${esc(v)}">${v?`<a class="go" href="tel:${esc(String(v).replace(/[^\d+]/g,''))}">☎</a>`:''}</div>`;
  else if (type==='money') inp = `<input type="number" inputmode="numeric" step="1000" min="0" data-k="${k}" value="${esc(v)}">`;
  else inp = `<input type="${type==='date'?'date':type==='email'?'email':'text'}" data-k="${k}" value="${esc(v)}">`;
  return `<label class="f ${wide?'wide':''}"><span>${lab}</span>${inp}</label>`;
}
function evHTML(h){
  const who = `<div class="h">${fmtDT(h.at)} · ${esc(h.user)}</div>`, p=h.payload||{};
  if (h.type==='note') return `<div class="ev note">${who}<div class="b">${esc(p.text)}</div></div>`;
  if (h.type==='stage') return `<div class="ev">${who}<div class="b">Стадия: ${esc(stageById(p.from).name)} → <b>${esc(stageById(p.to).name)}</b></div></div>`;
  if (h.type==='create') return `<div class="ev">${who}<div class="b">Карточка создана</div></div>`;
  const lines = Object.entries(p).map(([k,[a,b]]) => k==='brief'||k==='comment' ? `${LABEL[k]||k}: обновлён` : `${LABEL[k]||k}: ${esc(a??'—')} → ${esc(b??'—')}`);
  return `<div class="ev">${who}<div class="b">${lines.join('\n')}</div></div>`;
}
async function openDeal(id){
  let d = id ? {...S.deals.get(id)} : {stage: S.mobileStage && !stageById(S.mobileStage).closed ? S.mobileStage : 'NEW', responsible:S.me, source:'Авито'};
  let hist = [];
  S.open = {id, base:{...d}, stage:d.stage};
  const ov = $('#ov');
  const draw = () => {
    ov.innerHTML = `<div class="sheet" role="dialog">
      <div class="sh-head"><button class="btn ghost" data-close>✕</button><input data-k="title" value="${esc(d.title||'')}" placeholder="Имя клиента"></div>
      <div class="stages">${S.stages.map(s=>`<button class="st ${s.id===S.open.stage?'on':''}" data-st="${s.id}" style="${s.id===S.open.stage?`background:${s.color};border-color:${s.color}`:''}">${esc(s.name)}</button>`).join('')}</div>
      <div class="sh-body">
        ${GROUPS.map(([g,fs])=>`<div class="grp"><h4>${g}</h4><div class="grid">${fs.map(f=>fieldHTML(d,f)).join('')}</div></div>`).join('')}
        ${id?`<div class="grp"><h4>Лента</h4><div class="addnote"><textarea id="noteTxt" placeholder="Заметка: звонок, договорённость…"></textarea><button class="btn" id="noteBtn">Добавить</button></div><div class="feed" id="feed">${hist.map(evHTML).join('')||'<div class="ev"><div class="h">загрузка…</div></div>'}</div></div>`:''}
      </div>
      <div class="sh-foot"><span class="info">${id?`№${d.id}${d.bitrix_id?' · Битрикс '+d.bitrix_id:''} · изм. ${d.updated_at?fmtDT(d.updated_at):''}${d.updated_by?' · '+esc(d.updated_by):''}`:'Новая карточка'}</span>
        <button class="btn" data-close>Закрыть</button><button class="btn primary" id="saveBtn">${id?'Сохранить':'Создать'}</button></div>
    </div>`;
  };
  draw(); ov.classList.remove('hidden'); document.body.style.overflow='hidden';
  if (!id) setTimeout(()=>ov.querySelector('[data-k=title]').focus(), 50);
  if (id) api('get',{id}).then(j => { hist=j.history; const f=$('#feed'); if(f) f.innerHTML = hist.map(evHTML).join('') || '<div class="ev"><div class="h">Пока пусто</div></div>'; }).catch(()=>{});

  const collect = () => { const ch={}; ov.querySelectorAll('[data-k]').forEach(el => {
      const k=el.dataset.k; let v = el.type==='checkbox' ? (el.checked||null) : el.value.trim();
      if (v==='') v=null; if (el.type==='number' && v!=null) v=+v;
      const base = S.open.base[k] ?? null;
      if (String(v ?? '') !== String(base ?? '')) ch[k]=v;
      el.classList.toggle('chg', k in ch);
    }); return ch; };
  ov.oninput = collect;
  ov.onclick = async e => {
    if (e.target===ov || e.target.closest('[data-close]')) { closeDeal(collect); return; }
    const st = e.target.closest('[data-st]');
    if (st) { S.open.stage = st.dataset.st; ov.querySelectorAll('.st').forEach(b=>{const on=b.dataset.st===S.open.stage, c=stageById(b.dataset.st).color; b.classList.toggle('on',on); b.style.background=on?c:''; b.style.borderColor=on?c:'';});
      if (id) { await moveDeal(id, S.open.stage); S.open.base.stage=S.open.stage; api('get',{id}).then(j=>{const f=$('#feed'); if(f) f.innerHTML=j.history.map(evHTML).join('');}); } return; }
    if (e.target.id==='noteBtn') { const t=$('#noteTxt').value.trim(); if(!t) return;
      try { await api('note',{id,text:t}); $('#noteTxt').value=''; const j=await api('get',{id}); $('#feed').innerHTML=j.history.map(evHTML).join(''); } catch(err){ toast(err.message); } return; }
    if (e.target.id==='saveBtn') {
      const ch = collect();
      if (!id && !ch.title) { toast('Впишите имя клиента'); return; }
      if (id && !Object.keys(ch).length) { closeDeal(); return; }
      e.target.disabled = true;
      try { const j = await api('save', {id, changes:ch, stage: id ? undefined : S.open.stage});
        S.deals.set(j.deal.id, j.deal); render(); toast(id?'Сохранено':'Клиент добавлен'); closeDeal(); }
      catch(err){ toast('Ошибка: '+err.message); e.target.disabled=false; }
    }
  };
}
function closeDeal(collect){
  if (collect && Object.keys(collect()).length && !confirm('Есть несохранённые изменения. Закрыть без сохранения?')) return;
  $('#ov').classList.add('hidden'); $('#ov').innerHTML=''; document.body.style.overflow=''; S.open=null;
}
document.addEventListener('keydown', e => {
  if (!S.open) return;
  if (e.key==='Escape') $('#ov [data-close]').click();
  if ((e.ctrlKey||e.metaKey) && e.key==='s') { e.preventDefault(); $('#saveBtn').click(); }
});

/* ---------- демо-режим (?demo) — без сервера, данные в браузере ---------- */
function demoApi(action, b){
  const DB = JSON.parse(store.get('lkm_demo') || 'null') || {seq:4, h:[], deals:[
    {id:1,stage:'UC_X040U9',title:'Даша — Капучино 8×3',source:'Авито',responsible:'Сергей',model:'8×3 — 24 м²',next_date:today(),next_step:'Пригласить в цех'},
    {id:2,stage:'PREPAYMENT_INVOICE',title:'Алексей — 6×6 баня',source:'Авито',responsible:'Юрий',visit_date:today(),plot:'Есть'},
    {id:3,stage:'FINAL_INVOICE',title:'Максим — 6×8 под ключ',source:'Сайт — форма',responsible:'Юрий',amount:2150000,model:'6×8 — 48 м²'},
    {id:4,stage:'UC_NUPAHN',title:'Татьяна — баня, весна',source:'Авито',responsible:'Анна',next_date:'2027-03-01'}]};
  const save = () => store.set('lkm_demo', JSON.stringify(DB)), t = new Date().toISOString();
  const r = x => Promise.resolve({ok:true, ...x});
  const STG=[['NEW','Новый лид','#64748b'],['UC_MISSCALL','Н/О','#94a3b8'],['UC_X040U9','Общение','#0ea5e9'],['PREPARATION','Квалифицирован','#6366f1'],['UC_1T0IS0','КП без шоурума','#8b5cf6'],['PREPAYMENT_INVOICE','Записан в шоурум','#d97706'],['EXECUTING','Был в шоуруме','#ea580c'],['FINAL_INVOICE','КП и договор','#16a34a'],['1','В производстве','#15803d'],['UC_NUPAHN','Отложенный спрос','#a16207'],['WON','Сдан','#166534',1],['LOSE','Отказ','#dc2626',1],['APOLOGY','Спам / не целевой','#9ca3af',1]].map(([id,name,color,closed])=>({id,name,color,closed:!!closed}));
  const USERS=['Георгий','Сергей','Юрий','Анна','Андрей'];
  if (action==='users') return r({users:USERS});
  if (action==='login') return r({user:b.user, token:'demo:'+b.user});
  const me = (S.token||'').split(':')[1] || 'Демо';
  if (action==='meta') return r({me, stages:STG, users:USERS});
  if (action==='list') return r({now:t, deals:DB.deals});
  if (action==='get') return r({deal:DB.deals.find(d=>d.id===b.id), history:DB.h.filter(x=>x.deal_id===b.id).reverse()});
  if (action==='note') { DB.h.push({deal_id:b.id,at:t,user:me,type:'note',payload:{text:b.text}}); save(); return r({}); }
  let d = DB.deals.find(x=>x.id===b.id);
  if (action==='move') { DB.h.push({deal_id:d.id,at:t,user:me,type:'stage',payload:{from:d.stage,to:b.stage}}); d.stage=b.stage; }
  if (action==='save') { if(!d){ d={id:++DB.seq, stage:b.stage||'NEW'}; DB.deals.push(d); DB.h.push({deal_id:d.id,at:t,user:me,type:'create',payload:{}}); }
    const diff={}; for (const [k,v] of Object.entries(b.changes||{})) { diff[k]=[d[k]??null,v]; if(v==null) delete d[k]; else d[k]=v; }
    if (Object.keys(diff).length) DB.h.push({deal_id:d.id,at:t,user:me,type:'change',payload:diff}); }
  d.updated_at=t; d.updated_by=me; save(); return r({deal:{...d}});
}

/* ---------- запуск ---------- */
S.token = store.get('lkm_token');
if (DEMO && !S.token) S.token = 'demo:Сергей';
S.token ? start() : showLogin();
</script>
